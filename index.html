<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NYC · US Open 2026 — Lalo & Fefe</title>
    <meta name="description" content="App interactiva de seguimiento de viaje a Nueva York y US Open 2026. Itinerario detallado, Arthur Ashe Stadium, Go City Pass, recomendaciones y presupuesto." />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#090D16" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NYC US Open" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Favicons & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Fonts: Plus Jakarta Sans, Outfit & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased selection:bg-[#0284C7] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for PWA — production only. A SW intercepting
      // fetches during `npm run dev` fights Vite's HMR (stale cached module
      // scripts get served with the wrong MIME type, WebSocket reconnects
      // misbehave), so it's explicitly skipped on localhost.
      const isLocalDev = ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);
      if ('serviceWorker' in navigator && !isLocalDev) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('PWA ServiceWorker registrado con éxito:', reg.scope))
            .catch((err) => console.log('Error registrando ServiceWorker:', err));
        });
      } else if ('serviceWorker' in navigator && isLocalDev) {
        // Also unregister any SW left over from a previous production build
        // preview, so a stale cache can't haunt local dev either.
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((reg) => reg.unregister());
        });
      }
    </script>
  </body>
</html>
