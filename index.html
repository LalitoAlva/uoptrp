<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- The Content-Security-Policy is injected here at build time by the
         `csp` plugin in vite.config.js, and also sent as a real HTTP header
         by render.yaml. It is deliberately absent in dev: Vite's React
         refresh preamble is an inline script, which a policy without
         'unsafe-inline' would (correctly) block. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>NYC · US Open 2026 — Lalo & Fefe</title>
    <meta name="description" content="App interactiva de seguimiento de viaje a Nueva York y US Open 2026. Itinerario detallado, Arthur Ashe Stadium, Go City Pass, recomendaciones y presupuesto." />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#090D16" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NYC US Open" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Favicons & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Fonts: Plus Jakarta Sans, Outfit & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased selection:bg-[#0284C7] selection:text-white">
    <div id="root"></div>
    <!-- Google Identity Services — real Google Sign-In, no backend required -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.jsx"></script>
    <!-- External rather than inline so the CSP can forbid inline scripts. -->
    <script src="/register-sw.js"></script>
  </body>
</html>
