services:
  - type: web
    name: nyc-usopen-2026
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache

      # Security headers. The CSP mirrors the build-time <meta> injected by
      # vite.config.js, but as a real header it is authoritative and can carry
      # frame-ancestors, which <meta> cannot express. Keep the two in sync.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

      # Clickjacking protection for browsers that predate frame-ancestors.
      - path: /*
        name: X-Frame-Options
        value: DENY

      # Stop browsers from MIME-sniffing a response into something executable.
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      # Don't leak the full URL (or any path) to third-party origins.
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      # The app asks for geolocation itself; everything else stays off, and
      # no embedded frame gets any of it.
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"

      # Force HTTPS for a year, including subdomains.
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
